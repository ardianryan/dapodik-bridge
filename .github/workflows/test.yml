name: Test & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run Go Vulnerability Check (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'

      - name: Test Windows & Linux Cross-Compilation
        run: |
          echo "Testing Windows CLI amd64..."
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/bridge
          echo "Testing Windows GUI amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui" -o /dev/null ./cmd/bridge
          echo "Testing Windows CLI 386..."
          GOOS=windows GOARCH=386 go build -o /dev/null ./cmd/bridge
          echo "Testing Linux amd64..."
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/bridge
