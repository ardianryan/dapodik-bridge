name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multiplatform Binaries & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Windows & Linux Binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X 'github.com/ardianryan/dapodik-bridge/internal/config.AppVersion=${{ steps.version.outputs.version }}'"

          echo "Building Windows GUI amd64 (System Tray)..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui $LDFLAGS" -o dist/DapodikBridge-gui-windows-amd64.exe ./cmd/bridge

          echo "Building Windows GUI 386 (System Tray 32-bit)..."
          GOOS=windows GOARCH=386 go build -ldflags="-H=windowsgui $LDFLAGS" -o dist/DapodikBridge-gui-windows-386.exe ./cmd/bridge

          echo "Building Windows CLI amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/dapodik-bridge-windows-amd64.exe ./cmd/bridge

          echo "Building Windows CLI 386 (32-bit)..."
          GOOS=windows GOARCH=386 go build -ldflags="$LDFLAGS" -o dist/dapodik-bridge-windows-386.exe ./cmd/bridge

          echo "Building Linux amd64 (Server/Docker)..."
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/dapodik-bridge-linux-amd64 ./cmd/bridge

          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dapodik Bridge ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/DapodikBridge-gui-windows-amd64.exe
            dist/DapodikBridge-gui-windows-386.exe
            dist/dapodik-bridge-windows-amd64.exe
            dist/dapodik-bridge-windows-386.exe
            dist/dapodik-bridge-linux-amd64
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
